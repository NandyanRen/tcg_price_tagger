name: tcg_price_tagger
description: Put card prices on photos of TCG cards you're selling, with auto price lookup.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  html: ^0.15.4
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
